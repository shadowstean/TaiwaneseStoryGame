<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seeker 3 - 山海之間的共存與競逐</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            /* 保持與前幾關相同的 Google 雲端硬碟圖片直連網址 */
            background: url('https://lh3.googleusercontent.com/u/0/d/1LXQ3pcSpRuVaWD8IT5x7UYnh99Clg7yT') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            margin: 0;
        }
        .text-orange {
            color: #ff8c00 !important;
        }
        .btn-orange {
            background-color: #ff8c00 !important;
            border-color: #ff8c00 !important;
        }
        .btn-orange:hover, .btn-orange:active, .btn-orange:focus {
            background-color: #e07b00 !important;
            border-color: #e07b00 !important;
            box-shadow: 0 0 0 0.25rem rgba(255, 140, 0, 0.25) !important;
        }

        /* 彈出視窗內的文字排版 */
        .typewriter-text {
            white-space: pre-line; /* 讓 \n 換行符號生效 */
            line-height: 1.8;       /* 舒適行高 */
            letter-spacing: 1px;   /* 質感字距 */
            font-size: 1.05rem;
        }
        /* 彈出視窗的神祕深紫色背景 */
        .custom-modal-content {
            background-color: #120c24 !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 15px;
        }
        /* 填空題輸入框專用樣式 */
        .poem-input {
            width: 90px;
            display: inline-block;
            border-bottom: 2px solid #ff8c00 !important;
            border-top: none !important;
            border-left: none !important;
            border-right: none !important;
            border-radius: 0 !important;
            background: transparent !important;
            color: #ff8c00 !important;
            text-align: center;
            padding: 0 5px;
        }
        .poem-input:focus {
            box-shadow: none !important;
            border-bottom: 2px solid #ffffff !important;
        }
        /* 詩詞排版區 */
        .poem-zone {
            font-size: 1.2rem;
            line-height: 2.2;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" src="https://docs.google.com/uc?export=download&id=1NxMhw9oB3QZw1Qdopaxq2mtxVtHB1bOd" loop autoplay></audio>

    <div class="modal fade" id="missionModal3" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg"> <div class="modal-content text-white custom-modal-content shadow-lg">
                <div class="modal-body p-4">
                    
                    <h5 id="missionText3" class="typewriter-text fw-normal mb-4 text-center"></h5>
                    
                    <div id="inputArea" class="d-none text-center">
                        <hr class="border-secondary my-4">
                        <h5 class="text-orange fw-bold mb-3">【請在下方欄位填入失去的詩詞】</h5>
                        
                        <form id="modalAnwserForm" onsubmit="return checkModalAnswer(event)">
                            <div class="poem-zone my-4 fw-bold">
                                勸君切莫過台灣，<br>
                                台灣恰似 <input type="text" id="ans1" class="form-control poem-input" placeholder="???" autocomplete="off" required> ，<br>
                                千 <input type="text" id="ans2" class="form-control poem-input" placeholder="??" autocomplete="off" required> 人去 <input type="text" id="ans3" class="form-control poem-input" placeholder="??" autocomplete="off" required> 轉，<br>
                                知 <input type="text" id="ans4" class="form-control poem-input" placeholder="??" autocomplete="off" required> 都是難。
                            </div>
                            <button type="submit" class="btn btn-orange w-100 text-white fw-bold py-2 mt-3">解開謎題</button>
                        </form>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-5">
        <div class="card shadow-lg p-4 bg-black bg-opacity-25 text-center text-white">
            <h2 class="text-orange mb-3">恭喜進入下一階段</h2>
            <p class="lead">你已成功找回失去的詩詞，渡過驚濤駭浪的黑水溝！</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 依照圖片內容設定的第三關引言文字
        const introText3 = "跟著地圖「山海之間的共存與競逐」\n17 世紀的浪潮尚未平息\n1684 年臺灣被納入清帝國的版圖\n一艘又一艘渡海而來的船隻\n將無數移民帶向這片充滿未知的土地\n...\n在平原、丘陵與山麓之間\n新的村落逐漸興起\n農田與聚落在荒野中蔓延\n形塑出屬於這座島嶼的傳統社會\n然而在這場擴張之中\n原有的部族與文化\n承受前所未有的衝擊\n在山與海的交界之地\n不同的人群彼此依存\n也彼此競逐。\n而臺灣的命運\n就在這片交錯的土地上緩緩成形\n...\n請在展場內找到失去的詩詞";
        
        let index = 0;
        let missionModal;

        window.addEventListener('DOMContentLoaded', () => {
            missionModal = new bootstrap.Modal(document.getElementById('missionModal3'));
            missionModal.show();
            
            setTimeout(typeWriter, 600);

            // 全螢幕無感啟動背景音樂機制
            const startMusicSilently = () => {
                const music = document.getElementById("bgMusic");
                if (music) {
                    music.play().then(() => {
                        document.removeEventListener('click', startMusicSilently);
                        document.removeEventListener('touchstart', startMusicSilently);
                        document.removeEventListener('scroll', startMusicSilently);
                    }).catch(err => console.log("等待玩家操作中..."));
                }
            };

            document.addEventListener('click', startMusicSilently);
            document.addEventListener('touchstart', startMusicSilently);
            document.addEventListener('scroll', startMusicSilently);
        });

        // 打字機功能
        function typeWriter() {
            if (index < introText3.length) {
                document.getElementById("missionText3").innerHTML += introText3.charAt(index);
                index++;
                // 稍微調快一點點打字速度（80ms），因為第三關字數比較多，避免玩家等太久
                setTimeout(typeWriter, 80); 
            } else {
                document.getElementById("inputArea").classList.remove("d-none");
            }
        }

        // 驗證視窗內的填空答案
        function checkModalAnswer(event) {
            event.preventDefault();

            // 抓取 4 個輸入框的值，並自動去掉前後或中間可能不小心按到的空白
            const userAns1 = document.getElementById('ans1').value.replace(/\s+/g, "");
            const userAns2 = document.getElementById('ans2').value.replace(/\s+/g, "");
            const userAns3 = document.getElementById('ans3').value.replace(/\s+/g, "");
            const userAns4 = document.getElementById('ans4').value.replace(/\s+/g, "");

            // 正確答案定義
            const correct1 = "鬼門關";
            const correct2 = "個";
            const correct3 = "無人";
            const correct4 = "生知死";

            // 檢查是否完全正確
            if (userAns1 === correct1 && userAns2 === correct2 && userAns3 === correct3 && userAns4 === correct4) {
                alert("答案正確！順利補全渡台悲歌詩詞！");
                window.location.href = "https://shadowstean.github.io/TaiwaneseStoryGame/Seeker/Seeker_4.html";

                const music = document.getElementById("bgMusic");
                if (music) music.play().catch(e => console.log(e));

                missionModal.hide();
            } else {
                alert("詩詞的字詞好像不太正確，再仔細觀察一下展場展板喔！");
            }
        }
    </script>
</body>
</html>
