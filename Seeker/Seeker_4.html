<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seeker 4 - 新秩序下的苦悶與夢想</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            /* 保持與前幾關相同的 Google 雲端硬碟圖片直連網址 */
            background: url('https://lh3.googleusercontent.com/u/0/d/1LXQ3pcSpRuVaWD8IT5x7UYnh99Clg7yT') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            margin: 0;
        }
        .text-orange {
            color: #ff8c00 !important;
        }
        .btn-orange {
            background-color: #ff8c00 !important;
            border-color: #ff8c00 !important;
        }
        .btn-orange:hover, .btn-orange:active, .btn-orange:focus {
            background-color: #e07b00 !important;
            border-color: #e07b00 !important;
            box-shadow: 0 0 0 0.25rem rgba(255, 140, 0, 0.25) !important;
        }

        /* 彈出視窗內的文字排版 */
        .typewriter-text {
            white-space: pre-line; /* 讓 \n 換行符號生效 */
            line-height: 1.8;       /* 舒適行高 */
            letter-spacing: 1px;   /* 質感字距 */
            font-size: 1.05rem;
        }
        /* 彈出視窗的神祕深紫色背景 */
        .custom-modal-content {
            background-color: #120c24 !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 15px;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" src="https://docs.google.com/uc?export=download&id=1NxMhw9oB3QZw1Qdopaxq2mtxVtHB1bOd" loop autoplay></audio>

    <div class="modal fade" id="missionModal4" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-white custom-modal-content shadow-lg">
                <div class="modal-body p-4">
                    
                    <h5 id="missionText4" class="typewriter-text fw-normal mb-4 text-center"></h5>
                    
                    <div id="inputArea" class="d-none">
                        <hr class="border-secondary my-4">
                        <form id="modalAnwserForm" onsubmit="return checkModalAnswer(event)">
                            <div class="mb-3">
                                <label class="form-label text-orange fw-bold">請輸入正確的數字順序：</label>
                                <input type="text" id="seeker4Answer" class="form-control bg-dark text-white border-secondary text-center" placeholder="請輸入數字密碼" autocomplete="off" required>
                            </div>
                            <button type="submit" class="btn btn-orange w-100 text-white fw-bold py-2">解開謎題</button>
                        </form>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-5">
        <div class="card shadow-lg p-4 bg-black bg-opacity-25 text-center text-white">
            <h2 class="text-orange mb-3">恭喜進入下一階段</h2>
            <p class="lead">你已成功破解新秩序的密碼，找到了屬於未來的夢想！</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 依照圖片內容設定的第四關引言文字
        const introText4 = "再來前往「新秩序下的苦悶與夢想」\n1894 年，戰火燃起\n清國戰敗後\n臺灣被迫交付給新的統治者。\n...\n鋼鐵與軍勢自海上而來\n一個前所未有的秩序降臨於這座島嶼\n....\n土地被重新丈量\n制度被徹底改寫\n就連人們的思想與忠誠\n成為被要求的誓言。\n...\n在這場巨大的變革之中\n有人承受苦悶與壓迫\n也有人在時代裂縫中\n尋找屬於未來的夢想\n\n拿出信封2的道具在展區內\n找到對的順序(由北到南)\n並且在下方填入隊的數字";
        
        let index = 0;
        let missionModal;

        window.addEventListener('DOMContentLoaded', () => {
            missionModal = new bootstrap.Modal(document.getElementById('missionModal4'));
            missionModal.show();
            
            setTimeout(typeWriter, 600);

            // 全螢幕無感啟動背景音樂機制
            const startMusicSilently = () => {
                const music = document.getElementById("bgMusic");
                if (music) {
                    music.play().then(() => {
                        document.removeEventListener('click', startMusicSilently);
                        document.removeEventListener('touchstart', startMusicSilently);
                        document.removeEventListener('scroll', startMusicSilently);
                    }).catch(err => console.log("等待玩家操作中..."));
                }
            };

            document.addEventListener('click', startMusicSilently);
            document.addEventListener('touchstart', startMusicSilently);
            document.addEventListener('scroll', startMusicSilently);
        });

        // 打字機功能
        function typeWriter() {
            if (index < introText4.length) {
                document.getElementById("missionText4").innerHTML += introText4.charAt(index);
                index++;
                // 保持流暢的 80ms 播放速度
                setTimeout(typeWriter, 80); 
            } else {
                document.getElementById("inputArea").classList.remove("d-none");
            }
        }

        // 驗證視窗內的答案
        function checkModalAnswer(event) {
            event.preventDefault();
            
            // 抓取輸入值並清除所有空格
            const userAnswer = document.getElementById('seeker4Answer').value.replace(/\s+/g, "");

            // 檢查是否包含正確密碼
            if (userAnswer.includes("18941945")) {
                alert("答案正確！新秩序的密碼已順利解開！");
                window.location.href = "https://shadowstean.github.io/TaiwaneseStoryGame/Seeker/Seeker_5.html";
                const music = document.getElementById("bgMusic");
                if (music) music.play().catch(e => console.log(e));

                missionModal.hide();
            } else {
                alert("密碼順序似乎不太對，再對照信封2道具和展區由北到南確認一下喔！");
            }
        }
    </script>
</body>
</html>
