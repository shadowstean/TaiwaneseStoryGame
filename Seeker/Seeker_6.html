<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seeker Final - 大家的博物館</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            /* 保持與前幾關相同的 Google 雲端硬碟圖片直連網址 */
            background: url('https://lh3.googleusercontent.com/u/0/d/1LXQ3pcSpRuVaWD8IT5x7UYnh99Clg7yT') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            margin: 0;
        }
        .text-orange {
            color: #ff8c00 !important;
        }
        /* 結局按鈕通用樣式 */
        .btn-choice {
            transition: all 0.3s ease;
            letter-spacing: 2px;
            font-size: 1.1rem;
        }
        .btn-choice:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        /* 彈出視窗內的文字排版 */
        .typewriter-text {
            white-space: pre-line; /* 讓 \n 換行符號生效 */
            line-height: 1.8;       /* 舒適行高 */
            letter-spacing: 1px;   /* 質感字距 */
            font-size: 1.05rem;
        }
        /* 彈出視窗的神祕深紫色背景 */
        .custom-modal-content {
            background-color: #120c24 !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 15px;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" src="https://docs.google.com/uc?export=download&id=1NxMhw9oB3QZw1Qdopaxq2mtxVtHB1bOd" loop autoplay></audio>

    <div class="modal fade" id="finalModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-white custom-modal-content shadow-lg">
                <div class="modal-body p-4">
                    
                    <h5 id="finalText" class="typewriter-text fw-normal mb-4 text-center"></h5>
                    
                    <div id="choiceArea" class="d-none">
                        <hr class="border-secondary my-4">
                        <h5 class="text-orange fw-bold mb-4 text-center">選擇結局</h5>
                        
                        <div class="d-grid gap-3">
                            <button type="button" class="btn btn-outline-warning btn-choice py-3 fw-bold" onclick="selectEnding(1)">
                                1. 保留歷史
                            </button>
                            <button type="button" class="btn btn-outline-secondary btn-choice py-3 fw-bold" onclick="selectEnding(2)">
                                2. 忽略歷史
                            </button>
                            <button type="button" class="btn btn-outline-info btn-choice py-3 fw-bold" onclick="selectEnding(3)">
                                3. 創造新歷史
                            </button>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-5">
        <div class="card shadow-lg p-4 bg-black bg-opacity-25 text-center text-white">
            <h2 class="text-orange mb-3">旅程的終點</h2>
            <p class="lead">探知者，感謝你參與本次歷史調查。</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 依照圖片內容設定的最終章引言文字
        const finalIntroText = "最終我們來到「大家的博物館」\n......\n恭喜探知者\n你們已拾起散落於時代中的記憶碎片\n見證這座島嶼在交會、衝突、苦難與希\n望中逐漸成形\n過去並未消逝\n它仍沉睡在文物的裂痕中\n迴盪於山海之間\n也流動在每一位生活於此的人心中\n而此刻\n歷史的火炬已傳遞到你們手中";
        
        let index = 0;
        let missionModal;

        window.addEventListener('DOMContentLoaded', () => {
            missionModal = new bootstrap.Modal(document.getElementById('finalModal'));
            missionModal.show();
            
            setTimeout(typeWriter, 600);

            // 全螢幕無感啟動背景音樂機制
            const startMusicSilently = () => {
                const music = document.getElementById("bgMusic");
                if (music) {
                    music.play().then(() => {
                        document.removeEventListener('click', startMusicSilently);
                        document.removeEventListener('touchstart', startMusicSilently);
                        document.removeEventListener('scroll', startMusicSilently);
                    }).catch(err => console.log("等待玩家操作中..."));
                }
            };

            document.addEventListener('click', startMusicSilently);
            document.addEventListener('touchstart', startMusicSilently);
            document.addEventListener('scroll', startMusicSilently);
        });

        // 打字機功能
        function typeWriter() {
            if (index < finalIntroText.length) {
                document.getElementById("finalText").innerHTML += finalIntroText.charAt(index);
                index++;
                // 保持流暢的 80ms 播放速度
                setTimeout(typeWriter, 80); 
            } else {
                document.getElementById("choiceArea").classList.remove("d-none");
            }
        }

        // 選擇結局後的跳轉邏輯
        function selectEnding(choiceNumber) {
            if (choiceNumber === 1) {
                alert("你選擇了「保留歷史」，珍視過去的每一頁記憶。");
                // 請修改成你要前往的結局網頁檔案名稱或網址
                window.location.href = "https://shadowstean.github.io/TaiwaneseStoryGame/Seeker/Seeker_7.html"; 
            } 
            else if (choiceNumber === 2) {
                alert("你選擇了「忽略歷史」，隨風而去，踏上面向當下的路。");
                // 請修改成你要前往的結局網頁檔案名稱或網址
                window.location.href = "https://shadowstean.github.io/TaiwaneseStoryGame/Seeker/Seeker_8.html"; 
            } 
            else if (choiceNumber === 3) {
                alert("你選擇了「創造新歷史」，歷史的筆桿現在由你揮毫。");
                // 請修改成你要前往的結局網頁檔案名稱或網址
                window.location.href = "https://shadowstean.github.io/TaiwaneseStoryGame/Seeker/Seeker_9.html"; 
            }
        }
    </script>
</body>
</html>
