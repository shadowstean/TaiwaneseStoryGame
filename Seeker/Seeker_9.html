<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seeker - 歷史探知者完整版</title>

    <!-- 引入 Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: url('https://lh3.googleusercontent.com/u/0/d/1LXQ3pcSpRuVaWD8IT5x7UYnh99Clg7yT') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        .text-orange { color: #ff8c00 !important; }
        .btn-orange { background-color: #ff8c00 !important; border-color: #ff8c00 !important; color: white !important; }
        .btn-orange:hover { background-color: #e07b00 !important; }

        /* 彈出視窗樣式 */
        .custom-modal-content {
            background-color: #120c24 !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 15px;
            color: white;
        }
        .typewriter-text {
            white-space: pre-line;
            line-height: 1.8;
            letter-spacing: 1px;
            font-size: 1.05rem;
        }
        /* 第一關專用網格樣式 */
        .stage1-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        /* 詩詞填空樣式 */
        .poem-input {
            width: 85px;
            display: inline-block;
            border-bottom: 2px solid #ff8c00 !important;
            border-top: none !important; border-left: none !important; border-right: none !important;
            border-radius: 0 !important; background: transparent !important; color: #ff8c00 !important;
            text-align: center;
        }
        .title-number { font-size: 1.2rem; font-weight: bold; color: #ff8c00; width: 30px; }
    </style>
</head>
<body>

    <!-- 背景音樂 -->
    <audio id="bgMusic" src="https://docs.google.com/uc?export=download&id=1NxMhw9oB3QZw1Qdopaxq2mtxVtHB1bOd" loop></audio>

    <!-- 通用彈出視窗容器 -->
    <div class="modal fade" id="gameModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content custom-modal-content shadow-lg">
                <div class="modal-body p-4">
                    <h5 id="modalDisplayText" class="typewriter-text fw-normal mb-4 text-center"></h5>
                    <div id="modalInputArea" class="d-none">
                        <hr class="border-secondary my-4">
                        <div id="dynamicInputContent"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 主頁面內容 -->
    <div class="container mt-5">
        <div class="card shadow-lg p-4 bg-black bg-opacity-25 text-center text-white">
            <h2 id="mainTitle" class="text-orange mb-3">準備開始調查</h2>
            <p id="mainDesc" class="lead">請點擊下方按鈕啟動裝置...</p>
            <button id="startBtn" class="btn btn-orange btn-lg px-5" onclick="initGame()">啟動裝置</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let currentStep = 1;
        let index = 0;
        let gameModal;
        const modalTextEl = document.getElementById("modalDisplayText");
        const inputAreaEl = document.getElementById("modalInputArea");
        const dynamicContentEl = document.getElementById("dynamicInputContent");
        const music = document.getElementById("bgMusic");

        // 關卡資料庫
        const stages = {
            1: {
                title: "第一關：史前文明的足跡",
                text: "探知者，要解開這座島嶼的秘密，\n我們必須溯源而上。\n請根據時代線索，填入對應的遺物與遺址名稱：",
                render: () => `
                    <div class="stage1-grid mb-4">
                        <input type="text" id="s1_1" class="form-control bg-dark text-white border-secondary" placeholder="舊石器遺物">
                        <input type="text" id="s1_2" class="form-control bg-dark text-white border-secondary" placeholder="舊石器遺址">
                        <input type="text" id="s1_3" class="form-control bg-dark text-white border-secondary" placeholder="新石器遺物">
                        <input type="text" id="s1_4" class="form-control bg-dark text-white border-secondary" placeholder="新石器遺址">
                        <input type="text" id="s1_5" class="form-control bg-dark text-white border-secondary" placeholder="鐵器時代遺物">
                        <input type="text" id="s1_6" class="form-control bg-dark text-white border-secondary" placeholder="鐵器時代遺址">
                    </div>
                    <button class="btn btn-orange w-100" onclick="checkStage1()">解鎖第一道門</button>`
            },
            2: {
                title: "第二關：倚海而生的島與人",
                text: "接著來到「倚海而生的島與人」\n在道具包中拿出信封1和探秘紙\n透過探秘紙拼出英文單字",
                render: () => `<input type="text" id="ansField" class="form-control bg-dark text-white text-center mb-3" placeholder="請輸入英文單字"><button class="btn btn-orange w-100" onclick="checkAns('ABYSS')">提交</button>`
            },
            3: {
                title: "第三關：山海之間的共存與競逐",
                text: "請在展場內找到失去的詩詞\n並填入下方空白處：",
                render: () => `
                    <div class="text-center poem-zone text-white small mb-3">
                        勸君切莫過台灣，台灣恰似 <input id="p1" class="poem-input">，<br>
                        千 <input id="p2" class="poem-input"> 人去 <input id="p3" class="poem-input"> 轉，知 <input id="p4" class="poem-input"> 都是難。
                    </div>
                    <button class="btn btn-orange w-100" onclick="checkPoem()">提交</button>`
            },
            4: {
                title: "第四關：新秩序下的苦悶與夢想",
                text: "拿出信封2的道具在展區內\n找到對的順序(由北到南)\n並且在下方填入對的數字",
                render: () => `<input type="text" id="ansField" class="form-control bg-dark text-white text-center mb-3" placeholder="請輸入數字密碼"><button class="btn btn-orange w-100" onclick="checkAns('18941945')">解鎖</button>`
            },
            5: {
                title: "第五關：走向民主這條路",
                text: "這個展區有四大標題請依序填入：",
                render: () => `
                    <div class="mb-2 d-flex"><span class="title-number">1</span><input id="t1" class="form-control bg-dark text-white mb-2"></div>
                    <div class="mb-2 d-flex"><span class="title-number">2</span><input id="t2" class="form-control bg-dark text-white mb-2"></div>
                    <div class="mb-2 d-flex"><span class="title-number">3</span><input id="t3" class="form-control bg-dark text-white mb-2"></div>
                    <div class="mb-3 d-flex"><span class="title-number">4</span><input id="t4" class="form-control bg-dark text-white mb-2"></div>
                    <button class="btn btn-orange w-100" onclick="checkTitles()">提交</button>`
            },
            6: {
                title: "最終關：大家的博物館",
                text: "歷史的火炬已傳遞到你們手中\n\n請選擇你的結局：",
                render: () => `
                    <div class="d-grid gap-2">
                        <button class="btn btn-outline-warning" onclick="showEnding(1)">1. 保留歷史</button>
                        <button class="btn btn-outline-secondary" onclick="showEnding(2)">2. 忽略歷史</button>
                        <button class="btn btn-outline-info" onclick="showEnding(3)">3. 創造新歷史</button>
                    </div>`
            }
        };

        // 第一關驗證邏輯
        function checkStage1() {
            const a1 = document.getElementById('s1_1').value.trim();
            const a2 = document.getElementById('s1_2').value.trim();
            const a3 = document.getElementById('s1_3').value.trim();
            const a4 = document.getElementById('s1_4').value.trim();
            const a5 = document.getElementById('s1_5').value.trim();
            const a6 = document.getElementById('s1_6').value.trim();

            if (a1 === "骨針縫獸皮" && a2 === "八仙洞" && a3 === "卑南文化帶四突起環狀玦形玉耳飾" && 
                a4 === "墾丁" && a5 === "青花碟" && a6 === "淇武蘭") {
                alert("正確！已啟動時光引擎，進入下一階段。");
                nextStage();
            } else {
                alert("填寫的答案好像有誤，請再確認一下遺址與遺物的對應喔！");
            }
        }

        // --- 以下為通用核心功能 (與先前版本相同) ---

        function initGame() {
            gameModal = new bootstrap.Modal(document.getElementById('gameModal'));
            music.play().catch(() => {});
            loadStage(1);
            document.getElementById('startBtn').style.display = 'none';
        }

        function loadStage(s) {
            currentStep = s;
            index = 0;
            modalTextEl.innerHTML = "";
            inputAreaEl.classList.add("d-none");
            dynamicContentEl.innerHTML = stages[s].render();
            gameModal.show();
            typeWriter(stages[s].text);
            document.getElementById('mainTitle').innerText = stages[s].title;
        }

        function typeWriter(fullText) {
            if (index < fullText.length) {
                modalTextEl.innerHTML += fullText.charAt(index);
                index++;
                setTimeout(() => typeWriter(fullText), 70);
            } else {
                inputAreaEl.classList.remove("d-none");
            }
        }

        function checkAns(correct) {
            const val = document.getElementById('ansField').value.trim().toUpperCase();
            if (val.includes(correct)) { nextStage(); } else { alert("再想想看！"); }
        }

        function checkPoem() {
            const p1 = document.getElementById('p1').value.trim();
            const p2 = document.getElementById('p2').value.trim();
            const p3 = document.getElementById('p3').value.trim();
            const p4 = document.getElementById('p4').value.trim();
            if (p1==="鬼門關" && p2==="個" && p3==="無人" && p4==="生知死") { nextStage(); } else { alert("詩句填寫有誤！"); }
        }

        function checkTitles() {
            const t = [document.getElementById('t1').value.trim(), document.getElementById('t2').value.trim(), 
                        document.getElementById('t3').value.trim(), document.getElementById('t4').value.trim()];
            const ans = ["反共復國基地", "一同走過的記憶", "經濟奇蹟的幕後", "社會力的爆發"];
            if (JSON.stringify(t) === JSON.stringify(ans)) { nextStage(); } else { alert("順序或標題有誤！"); }
        }

        function nextStage() {
            gameModal.hide();
            setTimeout(() => { if (stages[currentStep + 1]) loadStage(currentStep + 1); }, 500);
        }

        function showEnding(type) {
            const endings = {
                1: "你選擇將所有記憶碎片完整保存，讓過去的聲音得以延續...\n你成為了記憶的守護者。",
                2: "你選擇放下這些碎片，任由它們再次沈入黑暗...\n你見證了記憶的消逝。",
                3: "你選擇以過去為基石，寫下屬於這個時代的新篇章...\n你成為了新時代的開拓者。"
            };
            modalTextEl.innerHTML = "";
            index = 0;
            inputAreaEl.classList.add("d-none");
            typeWriter(endings[type]);
            dynamicContentEl.innerHTML = `<button class="btn btn-orange w-100" onclick="location.reload()">重新開始調查</button>`;
        }
    </script>
</body>
</html>
