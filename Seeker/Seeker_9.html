<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seeker Ending - 新時代的開拓者</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            /* 保持與所有關卡完全相同的背景圖片直連網址 */
            background: url('https://lh3.googleusercontent.com/u/0/d/1LXQ3pcSpRuVaWD8IT5x7UYnh99Clg7yT') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            margin: 0;
        }
        .text-orange {
            color: #ff8c00 !important;
        }
        .btn-cyan {
            background-color: #0dcaf0 !important;
            border-color: #0dcaf0 !important;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        .btn-cyan:hover, .btn-cyan:active, .btn-cyan:focus {
            background-color: #0baccc !important;
            border-color: #0baccc !important;
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(13, 202, 240, 0.4) !important;
        }

        /* 彈出視窗內的文字排版 */
        .typewriter-text {
            white-space: pre-line; /* 讓 \n 換行符號生效 */
            line-height: 2;       /* 開拓者結局的流暢行高 */
            letter-spacing: 1.5px; /* 質感字距 */
            font-size: 1.1rem;
        }
        /* 彈出視窗的神祕深紫色背景 */
        .custom-modal-content {
            background-color: #120c24 !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 15px;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" src="https://docs.google.com/uc?export=download&id=1NxMhw9oB3QZw1Qdopaxq2mtxVtHB1bOd" loop autoplay></audio>

    <div class="modal fade" id="endingModal3" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-white custom-modal-content shadow-lg">
                <div class="modal-body p-4 text-center">
                    
                    <h3 class="text-info fw-bold mb-2">3. 創造新歷史</h3>
                    <h5 class="text-muted mb-4">（開拓者結局）</h5>
                    
                    <h5 id="endingText3" class="typewriter-text fw-normal mb-4"></h5>
                    
                    <div id="actionArea" class="d-none">
                        <hr class="border-secondary my-4">
                        <button type="button" class="btn btn-cyan w-100 text-dark fw-bold py-2" onclick="restartGame()">
                            迎向新時代
                        </button>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-5">
        <div class="card shadow-lg p-4 bg-black bg-opacity-25 text-center text-white">
            <h2 class="text-info mb-3">【 結局三：新時代的開拓者 】</h2>
            <p class="lead">歷史由你延伸，未來由你塑造。</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 依照圖片內容設定的結局三文字
        const endingIntroText3 = "你選擇以過去為基石，寫下屬於這個時代的新篇章。\n歷史碎片在你手中重新組合，與當代的聲音交織成前所未有的模樣。\n未來不再只是繼承，而是由每一個人的選擇共同塑造。\n\n你成為了新時代的開拓者。";
        
        let index = 0;
        let endingModal;

        window.addEventListener('DOMContentLoaded', () => {
            endingModal = new bootstrap.Modal(document.getElementById('endingModal3'));
            endingModal.show();
            
            setTimeout(typeWriter, 600);

            // 全螢幕無感啟動背景音樂機制
            const startMusicSilently = () => {
                const music = document.getElementById("bgMusic");
                if (music) {
                    music.play().then(() => {
                        document.removeEventListener('click', startMusicSilently);
                        document.removeEventListener('touchstart', startMusicSilently);
                        document.removeEventListener('scroll', startMusicSilently);
                    }).catch(err => console.log("等待玩家操作中..."));
                }
            };

            document.addEventListener('click', startMusicSilently);
            document.addEventListener('touchstart', startMusicSilently);
            document.addEventListener('scroll', startMusicSilently);
        });

        // 打字機功能
        function typeWriter() {
            if (index < endingIntroText3.length) {
                document.getElementById("endingText3").innerHTML += endingIntroText3.charAt(index);
                index++;
                // 保持流暢有質感的 100ms 字幕播放速度
                setTimeout(typeWriter, 100); 
            } else {
                document.getElementById("actionArea").classList.remove("d-none");
            }
        }

        // 結束歷史調查後的行為
        function restartGame() {
            alert("新時代的序幕已然拉開。辛苦了，開拓者！本次歷史調查圓滿落幕。");
            // 可視需求導回主畫面
            // window.location.href = "Seeker.html";
        }
    </script>
</body>
</html>
