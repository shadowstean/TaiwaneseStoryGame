<!-- 2. 引入 Bootstrap Bundle JS (包含 Popper，用於下拉選單等) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 監聽表單的送出事件 (submit)
        document.getElementById('PaleolithicAgeForm').addEventListener('submit', function(event) {
            
            // 1. 阻止表單預設的重整網頁動作
            event.preventDefault();

            // 2. 抓取使用者的輸入值
            // .trim() 的功能是自動刪除使用者不小心在前後按到的「空白鍵」
            const userRelic = document.getElementById('PaleolithicAgeRelic').value.trim();
            const userSite = document.getElementById('PaleolithicAgeSite').value.trim();

            // 3. 設定正確答案與指定要跳轉的網頁
            const correctRelic = "骨針縫獸皮";
            const correctSite = "八仙洞";
            
            // 這裡填入你答對時，想要強制跳轉的手機問卷網頁網址（如 Google 表單或 Typeform）
            const targetUrl = "https://shadowstean.github.io/TaiwaneseStoryGame/TaiwaneseStoryGame/PaleolithicAge.html"; 

            // 4. 進行條件判斷 (&& 代表「而且」，兩個都要成立)
            if (userRelic === correctRelic && userSite === correctSite) {
                
                alert("回答正確！即將為您跳轉至問卷頁面...");
                
                // 答對了，執行跳轉到指定的網頁
                window.location.href = targetUrl;
                
            } else {
                
                // 答錯了，跳出警告，且不會跳轉頁面
                alert("答案不正確，請再想想看石器時代的課本內容喔！");
                
            }
        });
    </script>
